<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="purple-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Top App Header -->
  <rect x="50" y="30" width="700" height="45" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="75" cy="52" r="5" fill="#10b981"/>
  <text x="90" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Maintenance Copilot &bull; Shopfloor GenAI Diagnostic Agent</text>
  
  <rect x="580" y="40" width="150" height="24" rx="5" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
  <text x="592" y="56" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#c7d2fe">RAG + GEMINI API</text>

  <!-- Main Chat & RAG Canvas Split -->
  <!-- Left Side: Chat Interface -->
  <rect x="50" y="90" width="420" height="350" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <!-- Operator Message Bubble -->
  <rect x="75" y="115" width="370" height="60" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="90" y="135" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#38bdf8">OPERATOR &bull; STATION LINE C1</text>
  <text x="90" y="156" font-family="'Inter', sans-serif" font-size="12" fill="#e2e8f0">"Facing Error F-204 on hydraulic clamp. Pressure drops below 40 bar during lock cycle."</text>

  <!-- RAG Vector Retrieval Indicator -->
  <rect x="75" y="190" width="370" height="32" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-dasharray="4,4"/>
  <text x="90" y="210" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#a5b4fc">&#128269; Vector Retrieval: Matched 'Extruder_Hydraulics_OEM_Manual.pdf' (p. 142)</text>

  <!-- AI Assistant Response Bubble -->
  <rect x="75" y="235" width="370" height="180" rx="8" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
  <text x="90" y="258" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#60a5fa">COPILOT &bull; STEP-BY-STEP REMEDIATION</text>
  
  <text x="90" y="280" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">1. Check Solenoid Valve YV-12 for coil burnout or debris.</text>
  <text x="90" y="302" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">2. Verify pilot line filter gauge (Normal: 120 bar &plusmn; 5 bar).</text>
  <text x="90" y="324" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#f8fafc">3. If YV-12 LED is illuminated, manually toggle bypass valve B-2.</text>
  <text x="90" y="346" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">Reference: Section 8.4 "Hydraulic Emergency Isolation Procedure"</text>
  <text x="90" y="365" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">&#10003; Grounded in OEM Manual &bull; Confidence: 99.1%</text>

  <!-- Right Side: RAG & LangChain Architecture Stack -->
  <rect x="490" y="90" width="260" height="350" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="515" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">RAG Architecture Stack</text>

  <!-- Stack Component 1: Ingestion & Embeddings -->
  <rect x="510" y="140" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="525" y="162" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8">1. Vector Embeddings</text>
  <text x="525" y="179" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Chunked PDF OEM manuals, schematics &amp; past breakdown logs</text>

  <!-- Stack Component 2: Vector Search -->
  <rect x="510" y="202" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="525" y="224" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#a855f7">2. Semantic Vector DB</text>
  <text x="525" y="241" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Cosine similarity top-k retrieval on error codes &amp; symptoms</text>

  <!-- Stack Component 3: LangChain & Gemini -->
  <rect x="510" y="264" width="220" height="52" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="525" y="286" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10b981">3. LangChain &amp; Gemini</text>
  <text x="525" y="303" font-family="'Inter', sans-serif" font-size="10" fill="#94a3b8">Context synthesis with conversational memory &amp; safety rules</text>

  <!-- Performance Metric Card -->
  <rect x="510" y="330" width="220" height="90" rx="8" fill="#111827" stroke="#2563eb" stroke-width="1.5"/>
  <text x="525" y="354" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">DIAGNOSIS LOOKUP TIME</text>
  <text x="525" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" fill="#38bdf8">&lt; 15 sec</text>
  <text x="525" y="408" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#10b981">&#9660; 70% Reduction in MTTR Lookup</text>
</svg>
