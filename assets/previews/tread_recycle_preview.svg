<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)"/>

  <!-- Conveyor Frame -->
  <rect x="80" y="80" width="640" height="320" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  
  <!-- Perspective Conveyor Belt -->
  <path d="M 120 360 L 260 120 L 540 120 L 680 360 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <line x1="200" y1="360" x2="310" y2="120" stroke="#334155" stroke-dasharray="6,6"/>
  <line x1="600" y1="360" x2="490" y2="120" stroke="#334155" stroke-dasharray="6,6"/>

  <!-- Folded Tread Piece Bounding Box -->
  <rect x="330" y="210" width="160" height="90" rx="4" fill="#3b82f6" fill-opacity="0.15" stroke="#3b82f6" stroke-width="2.5"/>
  <rect x="330" y="186" width="135" height="24" rx="3" fill="#2563eb"/>
  <text x="338" y="202" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#ffffff">RECYCLE TREAD 98.4%</text>

  <!-- Folded Rubber Geometry Illustration -->
  <path d="M 350 270 Q 400 240 450 270 Q 470 250 430 230 Q 380 230 350 270 Z" fill="#475569" stroke="#64748b" stroke-width="2"/>

  <!-- Virtual Optical Tripwire (Threshold Crossing Line) -->
  <line x1="160" y1="280" x2="640" y2="280" stroke="url(#cyan-glow)" stroke-width="4" filter="url(#glow)"/>
  <line x1="160" y1="280" x2="640" y2="280" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="10,6"/>

  <!-- Tripwire Badge -->
  <rect x="180" y="255" width="155" height="22" rx="4" fill="#0e7490" stroke="#22d3ee" stroke-width="1"/>
  <text x="188" y="270" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#e0f2fe">VIRTUAL TRIPWIRE LINE</text>

  <!-- Crossing Vector Arrow -->
  <path d="M 410 240 L 410 320 M 400 310 L 410 320 L 420 310" stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- UI Top Bar -->
  <rect x="80" y="80" width="640" height="40" rx="12" fill="#1e293b" fill-opacity="0.8"/>
  <circle cx="106" cy="100" r="5" fill="#10b981"/>
  <text x="120" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#f8fafc">TreadCycle AI &bull; Inline Extrusion Vision Counter</text>
  <rect x="585" y="90" width="120" height="20" rx="4" fill="#047857"/>
  <text x="595" y="104" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#d1fae5">PLC SYNC: ACTIVE</text>

  <!-- Live Counter Display Overlay (Right Panel) -->
  <rect x="530" y="140" width="170" height="150" rx="8" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.5"/>
  <text x="545" y="165" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#94a3b8">SHIFT RECYCLE TALLY</text>
  <text x="545" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="40" font-weight="800" fill="#38bdf8">142</text>
  <text x="630" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#64748b">pcs</text>
  
  <line x1="545" y1="225" x2="685" y2="225" stroke="#334155"/>
  <text x="545" y="245" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10b981">ACCURACY: 98.6%</text>
  <text x="545" y="262" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">EXTRUDER: LINE C1</text>
  <text x="545" y="278" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8">TRIGGER: THRESHOLD +1</text>

  <!-- Video Play Overlay Icon -->
  <circle cx="400" cy="240" r="32" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="392,226 416,240 392,254" fill="#38bdf8"/>
</svg>
